[package]
name = "airgradient-cli"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
crossterm = "0.28"
owo-colors = "4.1"
# 0.30 with the `crossterm_0_28` feature: `tui-slider` and `ratatui-toaster`
# both need 0.30, and pinning crossterm to the 0.28 this crate already drives
# the terminal with keeps that upgrade to one library rather than two.
# `unstable-widget-ref` is required by ratatui-toaster.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm_0_28",
    "unstable-widget-ref",
] }
ratatui-toaster = "0.1.4"
tui-slider = "0.3.3"
tui-spinner = "0.4.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
libc = "0.2"
portable-pty = "0.9"
predicates = "3.1"
tempfile = "3.14"
wiremock = "0.6"
