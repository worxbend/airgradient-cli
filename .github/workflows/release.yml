name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true

# Only the publish job creates a release; building needs read access alone.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_suffix: linux-amd64
            linker: ""
            apt_packages: ""
          - target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
            linker: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt_packages }}

      - name: Validate tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="$(awk -F '=' '
            /^\[package\][[:space:]]*$/ { in_package = 1; next }
            /^\[/ { if (in_package) exit }
            in_package && $1 ~ /^[[:space:]]*version[[:space:]]*$/ {
              value = $2
              sub(/#.*/, "", value)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              gsub(/^"|"$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)"

          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match Cargo.toml version v${version}." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
        id: package

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage release archive
        env:
          VERSION: ${{ steps.package.outputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail

          staging_dir="$(mktemp -d)"
          dist_dir="${PWD}/dist"
          asset_name="airgradient-cli-v${VERSION}-${ASSET_SUFFIX}.tar.gz"

          mkdir -p "${dist_dir}"
          cp "target/${TARGET}/release/airgradient-cli" "${staging_dir}/airgradient-cli"
          cp LICENSE "${staging_dir}/LICENSE"

          tar -C "${staging_dir}" -czf "${dist_dir}/${asset_name}" airgradient-cli LICENSE

      - name: Upload staged archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz | sort -k2 > SHA256SUMS

      - name: Create release if needed
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes "Linux binary release for amd64 and arm64."

      - name: Upload release assets
        run: gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/SHA256SUMS scripts/install.sh --clobber
