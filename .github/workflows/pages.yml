name: Pages

# Publishes the microsite in `site/` to GitHub Pages.
#
# `scripts/install.sh` is copied into the published site at build time rather
# than duplicated in `site/`, so the curl-pipe URL always serves the same
# script that is committed and released — there is no second copy to drift.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight publish: a half-deployed site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          cp scripts/install.sh _site/install.sh
          chmod 0644 _site/install.sh
          test -f _site/index.html
          test -f _site/install.sh

      - name: Verify served installer matches the committed script
        run: diff -u scripts/install.sh _site/install.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
