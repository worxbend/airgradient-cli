name: Pages

# Publishes the microsite in `site/` to GitHub Pages.
#
# `scripts/install.sh` is copied into the published site at build time rather
# than duplicated in `site/`, so the curl-pipe URL always serves the same
# script that is committed and released — there is no second copy to drift.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Narrowed per job below: building only reads the repository, and only the
# deploy job needs the Pages and OIDC permissions.
permissions:
  contents: read

# Never cancel an in-flight publish: a half-deployed site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          cp scripts/install.sh _site/install.sh
          chmod 0644 _site/install.sh
          test -f _site/index.html
          test -f _site/install.sh

      - name: Verify served installer matches the committed script
        run: diff -u scripts/install.sh _site/install.sh

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
