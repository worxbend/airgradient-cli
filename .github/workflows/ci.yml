name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9

      - name: Validate dependency policy
        run: cargo deny check

      - name: Validate release dry run (validation-only)
        run: |
          output_dir="$(mktemp -d "${RUNNER_TEMP}/release-dry-run.XXXXXX")"
          scripts/release-dry-run.sh --target x86_64-unknown-linux-gnu --output-dir "${output_dir}"

      - name: Validate formatting
        run: cargo fmt --check

      - name: Validate Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate tests
        run: cargo test

      - name: Report PTY coverage summary
        run: |
          set -o pipefail

          output_file="${RUNNER_TEMP}/pty-test-output.txt"

          set +e
          cargo test --test tui_pty --test tui_fetch_contract -- --nocapture 2>&1 | tee "${output_file}"
          test_exit_code="${PIPESTATUS[0]}"
          set -e

          {
            echo "### PTY coverage summary"
            echo
            if [ "${test_exit_code}" -ne 0 ]; then
              if grep -Eq "PTY test infrastructure (failed|error)" "${output_file}"; then
                echo "Result: PTY infrastructure failure."
                echo
                grep -E "PTY test infrastructure (failed|error)" "${output_file}" | sed 's/^/- /'
              else
                echo "Result: PTY integration tests failed."
              fi
            elif grep -q "conditional PTY .* coverage skipped" "${output_file}"; then
              echo "Result: PTY unavailable and conditionally skipped."
              echo
              grep "conditional PTY .* coverage skipped" "${output_file}" | sed 's/^/- /'
            else
              echo "Result: real pseudo-terminal coverage exercised."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${test_exit_code}"
