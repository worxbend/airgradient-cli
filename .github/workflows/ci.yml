name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Report PTY-backed TUI coverage
        run: |
          set -o pipefail

          output_file="${RUNNER_TEMP}/pty-test-output.txt"

          set +e
          cargo test --test tui_pty --test tui_fetch_contract -- --nocapture 2>&1 | tee "${output_file}"
          test_exit_code="${PIPESTATUS[0]}"
          set -e

          {
            echo "### PTY-backed TUI coverage"
            echo
            if [ "${test_exit_code}" -ne 0 ]; then
              if grep -Eq "PTY test infrastructure (failed|error)" "${output_file}"; then
                echo "Result: PTY test infrastructure failed."
                echo
                grep -E "PTY test infrastructure (failed|error)" "${output_file}" | sed 's/^/- /'
              else
                echo "Result: PTY integration tests failed."
              fi
            elif grep -q "conditional PTY .* coverage skipped" "${output_file}"; then
              echo "Result: PTY-unavailable skip; no real pseudo-terminal coverage ran on this runner."
              echo
              grep "conditional PTY .* coverage skipped" "${output_file}" | sed 's/^/- /'
            else
              echo "Result: exercised with a usable pseudo-terminal."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${test_exit_code}"
