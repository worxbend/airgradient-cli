[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = [
    { crate = "crossterm@0.28.1", reason = "Direct dependency and ratatui use 0.28 while comfy-table currently brings 0.29." },
    { crate = "crossterm@0.29.0", reason = "Transitive duplicate from comfy-table until the terminal stack converges." },
    { crate = "hashbrown@0.16.1", reason = "Transitive duplicate from ratatui/lru while h2/indexmap uses the newer line." },
    { crate = "hashbrown@0.17.1", reason = "Transitive duplicate from h2/indexmap until upstream dependencies converge." },
    { crate = "linux-raw-sys@0.4.15", reason = "Transitive duplicate through rustix 0.38 used by crossterm 0.28." },
    { crate = "linux-raw-sys@0.12.1", reason = "Transitive duplicate through rustix 1.x used by crossterm 0.29/tempfile." },
    { crate = "rustix@0.38.44", reason = "Transitive duplicate from crossterm 0.28 while newer crates use rustix 1.x." },
    { crate = "rustix@1.1.4", reason = "Transitive duplicate from crossterm 0.29/tempfile until crossterm versions converge." },
    { crate = "windows-sys@0.52.0", reason = "Transitive duplicate from ring/rustix while other dependencies use windows-sys 0.61." },
    { crate = "windows-sys@0.61.2", reason = "Transitive duplicate retained until Windows support crates converge." },
]
skip-tree = [
    # `windows-targets` fans out into eight per-architecture crates, so a
    # version split there is reported as sixteen duplicates rather than one.
    # Skipping the tree keeps that as the single fact it is. These are Windows
    # import libraries; this is a Linux-only release, so none of them are built
    # or shipped.
    { crate = "windows-targets@0.52.6", reason = "Pulled in via windows-sys 0.52 from ring and rustix 0.38." },
    { crate = "windows-targets@0.53.5", reason = "Pulled in via windows-sys 0.61 until the Windows support crates converge." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
